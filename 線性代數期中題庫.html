  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}

<script>
(function(){
const R = String.raw;
const m = s => '\\begin{bmatrix}' + s.split(';').map(r => r.trim().split(/\s+/).join('&')).join('\\\\') + '\\end{bmatrix}';
const aug = s => { const rows = s.split(';').map(r => r.trim().split(/\s+/)); const n = rows[0].length;
  return '\\left[\\begin{array}{' + 'c'.repeat(n - 1) + '|c}' + rows.map(r => r.join('&')).join('\\\\') + '\\end{array}\\right]'; };
const im = s => '\\(' + m(s) + '\\)';
const KEYS = ['a', 'b', 'c', 'd'];

const SECTIONS = [
  { id: 'A', name: '一、線性方程式與方程組' },
  { id: 'B', name: '二、列梯形形式' },
  { id: 'C', name: '三、矩陣運算' },
  { id: 'D', name: '四、反矩陣與基本矩陣' }
];

const MA = m('1 2 -1 4;0 1 0 3;0 0 1 -2');
const MB = m('1 -5 2 -1 3;0 0 1 3 -2;0 0 0 1 4;0 0 0 0 1');
const MC = m('1 2 -3 4;0 2 1 -1;0 0 1 -3');
const MD = m('1 0 0 -1;0 1 0 2;0 0 1 3;0 0 0 0');
const echelonOpts = [MA, MB, MC, MD].map(x => '\\(' + x + '\\)');

const QS = [
/* ---------- A ---------- */
{ sec:'A', topic:'線性方程式的定義', type:'multi',
  stem: R`<p>下列哪幾項是變數 \(x\) 與 \(y\) 的線性方程式？（複選）</p>`,
  opts: [R`\(2xy-6y=0\)`, R`\(e^{-2}x+5y=8\)`, R`\(\dfrac{x}{2}-\dfrac{y}{4}=0\)`, R`\(x^{-2}+2y^{-2}=6\)`],
  ans: [1,2],
  sol: R`<p>線性方程式的形式是 \(a_1x+a_2y=b\)：係數 \(a_1,a_2,b\) 都是<b>常數</b>，變數只能是<b>一次方</b>，不能互相相乘，也不能被包在其他函數（\(\sin\)、\(e^x\)、根號…）裡。</p>
  <ul><li>(a) 含 \(xy\) 項，兩個變數相乘 → 非線性。</li>
  <li>(b) \(e^{-2}\approx 0.135\) 只是常數係數，等於 \(0.135x+5y=8\) → <b>線性</b>。</li>
  <li>(c) 即 \(\tfrac12x-\tfrac14y=0\) → <b>線性</b>。</li>
  <li>(d) \(x^{-2}=\tfrac{1}{x^2}\)，變數是負二次方 → 非線性。</li></ul>`,
  why: {0:R`\(xy\) 是兩個變數相乘，屬於二次項。`, 3:R`\(x^{-2}\) 是負次方，不是一次方。`} },

{ sec:'A', topic:'線性方程式的定義', type:'multi',
  stem: R`<p>下列哪幾項是變數 \(x\) 與 \(y\) 的線性方程式？（複選）</p>`,
  opts: [R`\(3xy-4x=0\)`, R`\(2\sin(x)-y=14\)`, R`\(x+\sin(3)\,y=8\)`, R`\(2x-3y=4\)`],
  ans: [2,3],
  sol: R`<p>判斷重點：<b>變數</b>有沒有被乘在一起、或被包進函數裡；常數被包進函數則沒關係。</p>
  <ul><li>(a) 含 \(xy\) 項 → 非線性。</li>
  <li>(b) 變數 \(x\) 在 \(\sin\) 裡面 → 非線性。</li>
  <li>(c) \(\sin(3)\approx 0.141\) 是一個固定的數字，\(x\)、\(y\) 都是一次 → <b>線性</b>。</li>
  <li>(d) 標準的線性方程式 → <b>線性</b>。</li></ul>
  <p class="tip">易錯：(b) 和 (c) 長得很像，差別在 \(\sin\) 裡放的是變數 \(x\) 還是常數 \(3\)。</p>`,
  why: {0:R`\(xy\) 是兩個變數相乘。`, 1:R`變數 \(x\) 被放進 \(\sin\) 函數裡，不是一次項。`} },

{ sec:'A', topic:'等價方程組', type:'single',
  stem: R`<p>若一個線性方程式系統經過一連串的基本列運算之後，則和原來的線性方程式系統等價嗎？</p>`,
  opts: ['對，等價', '不對，不等價', '不一定', '以上皆非'],
  ans: [0],
  sol: R`<p>三種基本列運算：</p>
  <ol><li>交換兩列</li><li>某一列乘上<b>非零</b>常數</li><li>某一列的倍數加到另一列</li></ol>
  <p>每一種都能用另一個基本列運算還原（換回來、乘 \(\tfrac1c\)、再減回去），所以運算前後的方程組解集合完全相同，稱為<b>等價</b>。這就是高斯消去法能拿來解方程組的原因。</p>`,
  why: {1:'基本列運算不會改變解集合。', 2:'「乘上 0」不算基本列運算，所以不會出現改變解的情況。'} },

{ sec:'A', topic:'二元一次方程組', type:'single',
  stem: R`<p>解下列聯立方程式</p>\[\begin{cases} x-y=6\\ 2x+y=-6\end{cases}\]`,
  opts: ['\\((0,-6)\\)', '\\((1,-5)\\)', '\\((-1,-1)\\)', '\\((1,-1)\\)'],
  ans: [0],
  sol: R`<p>兩式相加消去 \(y\)：\(3x=0\Rightarrow x=0\)。</p><p>代回 \(x-y=6\)：\(y=-6\)。</p><p>驗算：\(2(0)+(-6)=-6\) ✓</p>`,
  why: {1:R`代入第二式：\(2(1)+(-5)=-3\neq-6\)。`, 2:R`代入第一式：\(-1-(-1)=0\neq6\)。`, 3:R`代入第一式：\(1-(-1)=2\neq6\)。`} },

{ sec:'A', topic:'二元一次方程組', type:'single',
  stem: R`<p>解下列聯立方程式</p>\[\begin{cases} -x-2y=-13\\ -4x+2y=2\end{cases}\]`,
  opts: [R`\(\left(\tfrac{11}{5},\tfrac{27}{5}\right)\)`, R`\(\left(\tfrac{27}{5},\tfrac{11}{5}\right)\)`, R`\(\left(-\tfrac{27}{5},-\tfrac{11}{5}\right)\)`, R`\(\left(a,\tfrac{26-2a}{5}\right)\)，\(a\) 為任意實數`],
  ans: [0],
  sol: R`<p>兩式相加消去 \(y\)：\(-5x=-11\Rightarrow x=\tfrac{11}{5}\)。</p>
  <p>代回第一式：\(-\tfrac{11}{5}-2y=-13\Rightarrow -2y=-\tfrac{54}{5}\Rightarrow y=\tfrac{27}{5}\)。</p>
  <p>驗算第二式：\(-\tfrac{44}{5}+\tfrac{54}{5}=\tfrac{10}{5}=2\) ✓</p>
  <p class="tip">兩條直線斜率分別是 \(-\tfrac12\) 與 \(2\)，不平行，所以恰好只有一組解。</p>`,
  why: {1:'把 x、y 的值對調了。', 2:'正負號錯，而且 x、y 對調。', 3:'兩直線斜率不同，只交於一點，不會有無限多組解。'} },

{ sec:'A', topic:'解的個數', type:'single',
  stem: R`<p>解下列聯立方程式</p>\[\begin{cases} 3x-y=5\\ 6x-2y=10\end{cases}\]`,
  opts: ['\\((3,-3)\\)', '\\((5,-5)\\)', '無解', '無限多組解'],
  ans: [3],
  sol: R`<p>第二式正好是第一式 \(\times 2\)（係數與常數項都成比例），兩條方程式是<b>同一條直線</b>。</p>
  <p>消去後得 \(0=0\)，只剩 \(3x-y=5\)。令 \(x=t\)，則 \(y=3t-5\)，解為 \((t,\,3t-5)\)，\(t\) 為任意實數 → <b>無限多組解</b>。</p>
  <p class="tip">對照：若係數成比例但常數項不成比例（例如 \(6x-2y=11\)），兩直線平行，才是無解。</p>`,
  why: {0:R`\(3(3)-(-3)=12\neq5\)，不是解。`, 1:R`\(3(5)-(-5)=20\neq5\)，不是解。`, 2:'常數項也成比例，是重合直線，不是平行線。'} },

{ sec:'A', topic:'三元一次方程組', type:'single',
  stem: R`<p>解下列聯立方程式</p>\[\begin{aligned} x-2y+3z&=9\\ -x+3y&=-4\\ 2x-5y+5z&=17\end{aligned}\]`,
  opts: ['\\((1,-1,2)\\)', '\\((2,-1,1)\\)', '\\((-1,1,2)\\)', '\\((2,1,-1)\\)'],
  ans: [0],
  sol: R`<p>高斯消去：</p>
  <ul><li>① + ②：\(y+3z=5\)</li><li>③ − 2×①：\(-y-z=-1\)</li>
  <li>兩式相加：\(2z=4\Rightarrow z=2\)，\(y=5-3(2)=-1\)</li>
  <li>代回①：\(x=9+2y-3z=9-2-6=1\)</li></ul>
  <p>驗算：\(1+2+6=9\)、\(-1-3=-4\)、\(2+5+10=17\) ✓</p>`,

const N = QS.length;
const per = 100 / N;
const answers = QS.map(() => new Set());
const peeked = new Set();
let submitted = false, shuffled = false, showAll = false, onlyWrong = false;
let order = QS.map((_, i) => i);

const list = document.getElementById('list');
const cards = [];
const esc = s => s;

QS.forEach((q, i) => {
  const multi = q.type === 'multi';
  const el = document.createElement('article');
  el.className = 'q' + (multi ? ' multi-q' : '');
  el.id = 'q-' + (i + 1);
  const optsHtml = q.opts.map((o, k) => `
    <label class="opt" for="q${i}-${k}">
      <input type="${multi ? 'checkbox' : 'radio'}" name="q${i}" id="q${i}-${k}" value="${k}">
      <span class="key">(${KEYS[k]})</span><span class="ot">${o}</span>
    </label>`).join('');
  el.innerHTML = `
    <div class="qh"><span class="qn"></span><span class="tag${multi ? ' multi' : ''}">${multi ? '複選' : '單選'}</span><span class="topic">${q.topic}</span><span class="status"></span></div>
    <div class="stem">${q.stem}</div>
    <div class="opts${q.wide ? ' wide' : ''}" role="${multi ? 'group' : 'radiogroup'}">${optsHtml}</div>
    <div class="whyline" hidden></div>
    <div class="qf"><button type="button" class="reveal" aria-expanded="false">顯示解答與解法</button></div>
    <div class="sol" hidden>
      <div class="ans">正確答案：${q.ans.map(k => '(' + KEYS[k] + ')').join('、')}</div>
      ${q.sol}
    </div>`;
  el.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
    if (submitted) return;
    const k = +inp.value;
    if (multi) { inp.checked ? answers[i].add(k) : answers[i].delete(k); }
    else { answers[i].clear(); answers[i].add(k); }
    updateProgress();
  }));
  el.querySelector('.reveal').addEventListener('click', () => toggleSol(i));
  cards.push(el);
});

function toggleSol(i, force) {
  const el = cards[i];
  const sol = el.querySelector('.sol');
  const btn = el.querySelector('.reveal');
  const open = force !== undefined ? force : sol.hidden;
  sol.hidden = !open;
  btn.textContent = open ? '收起解答' : '顯示解答與解法';
  btn.setAttribute('aria-expanded', String(open));
  if (open && !submitted && !peeked.has(i)) {
    peeked.add(i);
    const st = el.querySelector('.status');
    st.textContent = '已看解答'; st.classList.add('peek');
  }
}

function layout() {
  list.innerHTML = '';
  if (shuffled) {
    order.forEach((idx, n) => { cards[idx].querySelector('.qn').textContent = '第 ' + (n + 1) + ' 題'; list.appendChild(cards[idx]); });
  } else {
    let n = 0;
    SECTIONS.forEach(s => {
      const idxs = QS.map((q, i) => q.sec === s.id ? i : -1).filter(i => i >= 0);
      const h = document.createElement('h2');
      h.className = 'sec-h';
      h.innerHTML = `${s.name}<span>${idxs.length} 題</span>`;
      list.appendChild(h);
      idxs.forEach(i => { n++; cards[i].querySelector('.qn').textContent = '第 ' + n + ' 題'; list.appendChild(cards[i]); });
    });
  }
  applyFilter();
}

function applyFilter() {
  cards.forEach((el, i) => {
    el.hidden = onlyWrong && submitted && isCorrect(i);
  });
  list.querySelectorAll('.sec-h').forEach(h => { h.hidden = onlyWrong && submitted; });
}

const progT = document.getElementById('prog-t');
const fill = document.getElementById('fill');
function answeredCount() { return answers.filter(s => s.size > 0).length; }
function updateProgress() {
  const c = answeredCount();
  progT.innerHTML = submitted
    ? `已交卷 · 得分 <b>${score().toFixed(1)}</b>`
    : `已作答 <b>${c}</b> / ${N}`;
  fill.style.width = (submitted ? 100 : c / N * 100) + '%';
}

function isCorrect(i) {
  const a = answers[i], t = QS[i].ans;
  return a.size === t.length && t.every(k => a.has(k));
}
function score() { return QS.reduce((s, _, i) => s + (isCorrect(i) ? per : 0), 0); }

function typeset(els) {
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(els).catch(() => {});
}

function cardNo(i) { return cards[i].querySelector('.qn').textContent.replace(/[^0-9]/g, ''); }

function grade() {
  submitted = true;
  const wrong = [], skip = [];
  QS.forEach((q, i) => {
    const el = cards[i];
    el.classList.add('locked');
    el.querySelectorAll('input').forEach(inp => inp.disabled = true);
    const a = answers[i];
    const ok = isCorrect(i);
    const st = el.querySelector('.status');
    st.classList.remove('peek');
    el.classList.remove('st-ok', 'st-bad', 'st-skip');
    el.querySelectorAll('.opt').forEach((lab, k) => {
      const isAns = q.ans.includes(k), picked = a.has(k);
      if (isAns) lab.classList.add('is-correct');
      if (isAns && !picked && a.size && q.type === 'multi') lab.classList.add('is-missed');
      if (!isAns && picked) lab.classList.add('is-wrong');
    });
    const wl = el.querySelector('.whyline');
    if (ok) {
      el.classList.add('st-ok'); st.textContent = peeked.has(i) ? '答對 · 看過解答' : '答對';
      toggleSol(i, showAll);
      wl.hidden = true;
    } else if (a.size === 0) {
      el.classList.add('st-skip'); st.textContent = '未作答'; skip.push(i);
      toggleSol(i, true); wl.hidden = true;
    } else {
      el.classList.add('st-bad'); st.textContent = peeked.has(i) ? '答錯 · 看過解答' : '答錯'; wrong.push(i);
      const lines = [];
      [...a].sort().forEach(k => {
        if (!q.ans.includes(k)) lines.push(`<div><b>你選的 (${KEYS[k]}) 錯在：</b>${(q.why && q.why[k]) || '這個選項不符合題目條件，請看下方詳解。'}</div>`);
      });
      if (q.type === 'multi') q.ans.forEach(k => { if (!a.has(k)) lines.push(`<div><b>漏選 (${KEYS[k]})：</b>這也是正確選項。</div>`); });
      else lines.push(`<div><b>正確答案是 (${KEYS[q.ans[0]]})</b>，解法見下方。</div>`);
      wl.innerHTML = lines.join('');
      wl.hidden = false;
      toggleSol(i, true);
      typeset([wl]);
    }
  });
  renderResult(wrong, skip);
  updateProgress();
  applyFilter();
}

const result = document.getElementById('result');
function renderResult(wrong, skip) {
  const ok = N - wrong.length - skip.length;
  const sc = score();
  const byNo = arr => arr.slice().sort((x, y) => cardNo(x) - cardNo(y));
  const chip = (i, cls) => `<button type="button" class="chip${cls}" data-i="${i}">第 ${cardNo(i)} 題</button>`;
  result.innerHTML = `
    <div class="score-row">
      <div class="score">${sc.toFixed(1)}<small>/ 100 分</small></div>
      <div class="tally">
        <div class="t-ok"><b>${ok}</b><span>答對</span></div>
        <div class="t-bad"><b>${wrong.length}</b><span>答錯</span></div>
        <div class="t-skip"><b>${skip.length}</b><span>未作答</span></div>
        <div><b>${peeked.size}</b><span>交卷前看過解答</span></div>
      </div>
    </div>
    ${wrong.length ? `<div><p class="res-label">答錯的題目（點擊跳到該題，詳解已展開）</p><div class="chips">${byNo(wrong).map(i => chip(i, '')).join('')}</div></div>` : ''}
    ${skip.length ? `<div><p class="res-label">未作答</p><div class="chips">${byNo(skip).map(i => chip(i, ' skip')).join('')}</div></div>` : ''}
    ${!wrong.length && !skip.length ? '<p class="note">全部答對！</p>' : ''}
    <div class="res-actions">
      <button type="button" class="btn" id="btn-onlywrong" aria-pressed="${onlyWrong}">只顯示錯題與未作答</button>
      <button type="button" class="btn" id="btn-retry">重新作答</button>
    </div>
    <p class="note">計分方式：每題 ${per.toFixed(2)} 分，複選題需完全答對才給分（實際考試的部分給分規則可能不同）。</p>`;
  result.hidden = false;
  result.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    const el = cards[+c.dataset.i];
    if (el.hidden) { onlyWrong = false; applyFilter(); }
    el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }));
  document.getElementById('btn-onlywrong').addEventListener('click', e => {
    onlyWrong = !onlyWrong; e.currentTarget.setAttribute('aria-pressed', String(onlyWrong)); applyFilter();
  });
  document.getElementById('btn-retry').addEventListener('click', reset);
  result.scrollIntoView({ block: 'start' });
}

function reset() {
  submitted = false; onlyWrong = false;
  answers.forEach(s => s.clear()); peeked.clear();
  cards.forEach((el, i) => {
    el.classList.remove('locked', 'st-ok', 'st-bad', 'st-skip');
    el.querySelectorAll('input').forEach(inp => { inp.disabled = false; inp.checked = false; });
    el.querySelectorAll('.opt').forEach(l => l.classList.remove('is-correct', 'is-wrong', 'is-missed'));
    const st = el.querySelector('.status'); st.textContent = ''; st.classList.remove('peek');
    el.querySelector('.whyline').hidden = true;
    toggleSol(i, false);
  });
  showAll = false; document.getElementById('btn-all').setAttribute('aria-pressed', 'false');
  result.hidden = true; result.innerHTML = '';
  if (shuffled) order = shuffle(order);
  hideConfirm();
  submitBtn.textContent = '交卷';
  layout(); updateProgress();
  window.scrollTo({ top: 0 });
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* controls */
document.getElementById('btn-shuffle').addEventListener('click', e => {
  shuffled = !shuffled;
  e.currentTarget.setAttribute('aria-pressed', String(shuffled));
  e.currentTarget.textContent = shuffled ? '隨機題序（開）' : '隨機題序';
  if (shuffled) order = shuffle(QS.map((_, i) => i));
  layout();
});
document.getElementById('btn-all').addEventListener('click', e => {
  showAll = !showAll;
  e.currentTarget.setAttribute('aria-pressed', String(showAll));
  cards.forEach((_, i) => toggleSol(i, showAll || (submitted && !isCorrect(i))));
});
document.getElementById('btn-reset').addEventListener('click', reset);

const confirmBox = document.getElementById('confirm');
const submitBtn = document.getElementById('btn-submit');
function hideConfirm() { confirmBox.hidden = true; confirmBox.innerHTML = ''; submitBtn.hidden = false; }
submitBtn.addEventListener('click', () => {
  if (submitted) { result.scrollIntoView({ block: 'start' }); return; }
  const left = N - answeredCount();
  if (left > 0) {
    confirmBox.innerHTML = `<span>還有 <b>${left}</b> 題未作答</span><button type="button" class="btn primary" id="c-yes">仍要交卷</button><button type="button" class="btn" id="c-no">繼續作答</button>`;
    confirmBox.hidden = false; submitBtn.hidden = true;
    document.getElementById('c-yes').addEventListener('click', () => { hideConfirm(); doSubmit(); });
    document.getElementById('c-no').addEventListener('click', hideConfirm);
    return;
  }
  doSubmit();
});
function doSubmit() { grade(); submitBtn.textContent = '查看成績'; }

layout();
updateProgress();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
